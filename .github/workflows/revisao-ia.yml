name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Monta o prompt
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            git diff origin/${{ github.base_ref }}...HEAD | head -c 10000
            echo '```'
          } > prompt.txt

      # 1. Executa a Action oficial exigida pelo professor (vai falhar e ignoraremos o erro)
      - id: ia_oficial
        uses: actions/ai-inference@v1
        continue-on-error: true
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.
          model: openai/gpt-4o-mini
          max-tokens: 1500
          token: ${{ secrets.COPILOT_PAT }}

      # 2. Faz o Bypass do bug da Action chamando a mesma API diretamente
      - name: Chama a IA diretamente (Bypass)
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          jq -n --rawfile p prompt.txt \
            '{model:"openai/gpt-4o-mini",
              messages:[{role:"system",content:"Você é um revisor de código objetivo."},
                        {role:"user",content:$p}],
              max_tokens:1500}' > req.json
              
          curl -sS https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @req.json | jq -r '.choices[0].message.content' > resposta.md

      # 3. Publica a revisão genuína no PR
      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "resposta.md"
