name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo 'diff'
            git diff origin/${{ github.base_ref }}...HEAD | head -c 20000
            echo ''
          } > prompt.txt

      - name: Executa revisão com Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: copilot -p "$(cat prompt.txt)" -s --no-ask-user > resposta.txt

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file resposta.txt
