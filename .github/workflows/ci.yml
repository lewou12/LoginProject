name: ci
on:
  push:
  pull_request:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Procura segredos versionados
        run: |
          if git grep -nE "GOCSPX-client_secret *= *['\"][^'\"]+" -- . ':!*.md'; then
            echo "::error::Possível segredo no repositório"; exit 1
          fi
      - name: Aplica as migrações D1 em um SQLite local
        run: |
          for f in migrations/*.sql; do sqlite3 teste.db < "$f"; done
          sqlite3 teste.db ".tables"
      - name: Instala Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valida HTML
        run: npx -yes htmlhint "**/*.html"